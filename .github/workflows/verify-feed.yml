name: Verify Signed License Feed
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent Ed25519 verifier
        run: python -m pip install 'cryptography>=44,<50'
      - name: Verify published manifest signature and privacy
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, re
          from datetime import date
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          raw=Path('docs/licenses.json').read_bytes()
          assert len(raw) <= 1024*1024
          data=json.loads(raw)
          assert set(data)=={'schema','product','revision','generated_at','licenses','signature'}
          assert data['schema']==1 and data['product']=='NIDI-MIKROTIK-CARDS'
          assert type(data['revision']) is int and data['revision']>=1
          assert type(data['licenses']) is dict
          assert 'customer' not in raw.decode('utf-8').lower()
          def valid_binding(status, device):
              if device is None:
                  return status in ('pending', 'revoked')
              return status in ('active', 'suspended', 'revoked') and isinstance(device, str) and bool(re.fullmatch(r'[A-F0-9]{64}', device))
          # Isolated regressions: revocation before first use remains publishable.
          for status in ('pending', 'active', 'suspended', 'revoked'):
              assert valid_binding(status, None) == (status in ('pending', 'revoked'))
              assert valid_binding(status, 'AB'*32) == (status != 'pending')
              assert not valid_binding(status, 'invalid')
          for key, item in data['licenses'].items():
              assert re.fullmatch(r'[A-F0-9]{64}',key)
              assert set(item)=={'device','status','expires'}
              # A newly issued license is deliberately unbound until first use.
              assert item['status'] in ('pending','active','suspended','revoked')
              assert valid_binding(item['status'], item['device'])
              expiry=item['expires']
              assert expiry is None or (isinstance(expiry,str) and
                  re.fullmatch(r'\d{4}-\d{2}-\d{2}',expiry) and date.fromisoformat(expiry))
          signature=base64.b64decode(data.pop('signature'),validate=True)
          public=base64.b64decode('3hSPo3JvQxHBbUdHhkds7r06gTLC/Nh9cmqo3R276qU=')
          canonical=json.dumps(data,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode('utf-8')
          Ed25519PublicKey.from_public_bytes(public).verify(signature,canonical)
          print('Signed public license feed verified; no customer names')
          PY
